[package]
name = "dupes"
version = "0.1.0"
edition = "2024"
description = "Find duplicate files by content and report how much space they waste"
repository = "https://github.com/stern9/dupes"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["duplicates", "dedupe", "files", "cli", "blake3"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
